services:
  hydradb:
    build:
      context: .
      dockerfile: infra/hydradb/Dockerfile
    image: ghcr.io/krishhgg/hydrahack-hydradb:latest
    environment:
      HYDRADB_TOKEN: ${HYDRADB_TOKEN:-local-development-token-32-bytes}
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9090:9090"
    volumes:
      - hydradb-data:/data
    restart: unless-stopped

  # The app sits behind a profile until the core thread's hydrahack.api exists:
  #   docker compose --profile app up --build
  app:
    profiles: ["app"]
    build: .
    environment:
      HYDRADB_URL: http://hydradb:8443
      HYDRADB_ADMIN_URL: http://hydradb:9090
      HYDRADB_TOKEN: ${HYDRADB_TOKEN:-local-development-token-32-bytes}
    env_file:
      - path: .env
        required: false
    depends_on:
      hydradb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  hydradb-data:
