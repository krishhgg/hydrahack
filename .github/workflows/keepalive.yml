name: Keep alive

# Render's free tier spins down after 15 idle minutes and a cold start takes minutes at 0.1 CPU,
# so ping /health every 5 minutes (GitHub's scheduled runs often start late). No secret needed.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LIVE_URL: ${{ vars.LIVE_URL || 'https://hydrahack-live.onrender.com' }}
    steps:
      - name: GET /health
        run: |
          curl -sS --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 -o /dev/null -w "%{http_code} in %{time_total}s\n" "$LIVE_URL/health"
