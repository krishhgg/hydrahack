name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Start HydraDB
        # Builds the thin wrapper over the pinned upstream engine image (seconds, no Rust build).
        # --wait blocks until the round-trip healthcheck passes.
        run: docker compose up -d --build --wait --wait-timeout 120 hydradb
      - run: uv run pytest -m integration
      - name: HydraDB logs on failure
        if: failure()
        run: docker compose logs hydradb | tail -100
